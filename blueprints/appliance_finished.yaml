blueprint:
  name: Appliance Monitor – Finished Notification
  description: >
    Sends a notification when a monitored appliance finishes a cycle — the
    moment the load is ready. With the post-cycle phase enabled that is the
    start of that phase, not the later point where the appliance finally goes
    quiet. Optionally shows cycle duration and energy consumed. Includes an
    "Unloaded" action in the mobile notification that acknowledges the cycle
    without leaving your phone.
  domain: automation

  input:
    finished_sensor:
      name: Finished Sensor
      description: >
        The "finished" binary sensor exposed by the Appliance Monitor
        integration. It turns on as soon as the programme is done, post-cycle
        phase included, and off again when the cycle is acknowledged or a new
        one starts.
      selector:
        entity:
          filter:
            - integration: appliance_monitor
              domain: binary_sensor

    unloaded_button:
      name: Unloaded Button
      description: >
        The "Unloaded" button from Appliance Monitor — not "Reset State", which
        is the escape hatch for a stuck machine and discards the current cycle.
        Tapping "Unloaded" in the notification presses it, returning the
        appliance to idle while keeping the last cycle's duration and energy
        readable. Leave blank to send a notification without an action.
      default: ""
      selector:
        entity:
          filter:
            - integration: appliance_monitor
              domain: button

    cycle_duration_sensor:
      name: Cycle Duration Sensor
      description: >
        The "Cycle Duration" sensor from Appliance Monitor. When set, the
        notification includes how long the cycle took. It freezes when the work
        stops, so it is final by the time this fires. Leave blank to skip.
      default: ""
      selector:
        entity:
          filter:
            - integration: appliance_monitor
              domain: sensor

    cycle_energy_sensor:
      name: Cycle Energy Sensor
      description: >
        The "Cycle Energy" sensor from Appliance Monitor. When set, the
        notification includes the energy consumed during the cycle. Unlike the
        duration it keeps counting through the post-cycle phase, so the figure
        in the message is the energy up to the moment the load became ready.
        Leave blank to skip.
      default: ""
      selector:
        entity:
          filter:
            - integration: appliance_monitor
              domain: sensor

    appliance_name:
      name: Appliance Name
      description: >
        Display name used in notifications.
        Leave blank to auto-detect from the entity's friendly name.
      default: ""
      selector:
        text:

    notify_service:
      name: Notification Service
      description: >
        Notification service to call, e.g. notify.mobile_app_my_phone or
        notify.my_group. Find yours under Developer Tools → Services.
      default: notify.notify
      selector:
        text:

# Run one branch at a time and drop overlapping triggers silently: the
# appliance_cleared run that action_unloaded's button press sets off is
# intentionally discarded.
mode: single
max_exceeded: silent

trigger:
  - id: appliance_finished
    platform: state
    entity_id: !input finished_sensor
    to: "on"

  # Covers every way the cycle stops being ready to unload: the Unloaded button,
  # a state reset, or a new cycle starting.
  - id: appliance_cleared
    platform: state
    entity_id: !input finished_sensor
    from: "on"
    to: "off"

  # Fired when the user taps "Unloaded" in the mobile notification.
  # The action string equals the finished_sensor entity_id — unique per instance,
  # resolved at blueprint instantiation time via !input so no template is needed.
  - id: action_unloaded
    platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: !input finished_sensor

variables:
  finished_sensor: !input finished_sensor
  unloaded_button: !input unloaded_button
  cycle_duration_sensor: !input cycle_duration_sensor
  cycle_energy_sensor: !input cycle_energy_sensor
  appliance_name_input: !input appliance_name
  appliance_name: >
    {% if appliance_name_input != '' %}
      {{ appliance_name_input }}
    {% else %}
      {{ state_attr(finished_sensor, 'friendly_name') | regex_replace('(?i) ?finished$', '') | trim }}
    {% endif %}
  notification_id: "appliance_finished_{{ finished_sensor | replace('.', '_') }}"
  finished_at: "{{ now().strftime('%H:%M') }}"
  has_duration: >
    {{ cycle_duration_sensor != ''
       and states(cycle_duration_sensor) not in ['unavailable', 'unknown', 'none'] }}
  has_energy: >
    {{ cycle_energy_sensor != ''
       and states(cycle_energy_sensor) not in ['unavailable', 'unknown', 'none'] }}
  # Both report the entity as displayed, unit included. Reformatting them here
  # would have to know which unit the entity currently shows.
  duration_text: >
    {% if has_duration %}{{ states(cycle_duration_sensor, with_unit=True) }}{% endif %}
  energy_text: >
    {% if has_energy %}{{ states(cycle_energy_sensor, with_unit=True) }}{% endif %}
  message: >
    {{ appliance_name }} finished at {{ finished_at }}.
    {%- if has_duration %} Cycle took {{ duration_text | trim }}.{% endif %}
    {%- if has_energy %} Used {{ energy_text | trim }}.{% endif %}
  notification_actions: >
    {% if unloaded_button != '' %}
      {{ [{"action": finished_sensor, "title": "Unloaded"}] }}
    {% else %}
      {{ [] }}
    {% endif %}

action:
  - choose:
      - conditions:
          - condition: trigger
            id: appliance_finished
        sequence:
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_id }}"
              title: "{{ appliance_name }} finished"
              message: "{{ message }}"

          - action: !input notify_service
            data:
              title: "{{ appliance_name }} finished"
              message: "{{ message }}"
              data:
                importance: high
                persistent: true
                sticky: true
                channel: Appliance
                notification_icon: "mdi:washing-machine-alert"
                tag: "{{ notification_id }}"
                actions: "{{ notification_actions }}"

      - conditions:
          - condition: trigger
            id: appliance_cleared
        sequence:
          - action: persistent_notification.dismiss
            data:
              notification_id: "{{ notification_id }}"

          - action: !input notify_service
            data:
              message: clear_notification
              data:
                tag: "{{ notification_id }}"

      - conditions:
          - condition: trigger
            id: action_unloaded
        sequence:
          # All-or-nothing: only act when an unloaded button is configured, so we
          # never clear the notification while leaving the state finished.
          - if:
              - condition: template
                value_template: "{{ unloaded_button != '' }}"
            then:
              - action: button.press
                target:
                  entity_id: "{{ unloaded_button }}"
              # Clear here, not via the appliance_cleared trigger: that follow-on
              # run fires while this one is still active and is dropped by single
              # mode.
              - action: persistent_notification.dismiss
                data:
                  notification_id: "{{ notification_id }}"

              - action: !input notify_service
                data:
                  message: clear_notification
                  data:
                    tag: "{{ notification_id }}"
